name: Deploy to EC2 and Amplify

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    name: Deploy Backend to EC2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -t rsa,ed25519 ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$EC2_USER@$EC2_HOST" << 'EOF'
          set -e
          cd ~/app
          git pull origin main
          docker compose -f docker-compose.prod.yml up -d --build
          docker compose -f docker-compose.prod.yml logs server | tail -20
          EOF

      - name: Health check
        run: |
          sleep 15
          for i in {1..5}; do
            if curl -sf https://13-205-55-157.sslip.io/api/v1/health; then
              echo "✅ API is healthy"
              exit 0
            fi
            echo "Attempt $i/5 - API not ready yet, waiting..."
            sleep 5
          done
          echo "❌ API health check failed"
          exit 1

      - name: Deployment result
        if: always()
        run: |
          if [ $? -eq 0 ]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed!"
            exit 1
          fi
